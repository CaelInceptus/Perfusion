name: Build Perfusion
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build solution
      run: msbuild Perfusion.sln /p:Configuration=Release /p:Platform=x64
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Perfusion
        path: x64/Release/Perfusion.exe
